<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launch App | PiPaaS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header>
        <h1>🚀 Launch Your Application</h1>
        <p>Configure your public hostname and deploy your app to the cloud</p>
    </header>

    <main>
        <div class="card">
            <div class="card-header">
                <h3>Step 3: Cloudflare Tunnel Configuration</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="form-group">
                        <label for="subdomain">Subdomain</label>
                        <input type="text" class="form-control" id="subdomain" name="subdomain" required>
                    </div>

                    <div class="form-group">
                        <label for="docker_port">Docker Port</label>
                        <input type="number" class="form-control" id="docker_port" name="docker_port"
                            value="{{ docker_port or '' }}" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Launch App</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 PiPaaS Dashboard | Powered by Xythercoder</p>
    </footer>
</body>

</html>
