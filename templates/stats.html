<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiPaaS Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <header>
        <h1>🌐 PiPaaS</h1>
        <p>Mini-Server Powered by Raspberry Pi</p>
        {% if session.get('username') %}
            <p>Logged in as {{ session['username'] }} | <a href="{{ url_for('logout') }}">Logout</a></p>
        {% endif %}
    </header>

    <main>
        <h2>Active Containers</h2>

        <div id="container-list">
            <!-- Containers will be dynamically added here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2025 PiPaaS Dashboard | Powered by Xythercoder</p>
    </footer>

    <script>
        function fetchContainerStats() {
            $.getJSON( '/api/stats', function ( data ) {
                let containerList = $( '#container-list' );
                containerList.empty(); // Clear existing containers

                // Iterate over the data and create HTML for each container
                data.forEach( function ( container ) {
                    let statusClass = '';
                    if ( container.status === 'running' ) {
                        statusClass = 'running';
                    } else if ( container.status === 'exited' ) {
                        statusClass = 'exited';
                    } else {
                        statusClass = 'unknown';
                    }

                    containerList.append( `
                        <div class="card">
                            <div class="card-header">
                                <h3>${ container.name }</h3>
                            </div>
                            <div class="card-body">
                                <p><strong>ID:</strong> ${ container.id }</p>
                                <p><strong>Status:</strong>
                                    <span class="status ${ statusClass }">
                                        ${ container.status }
                                    </span>
                                </p>
                                <p><strong>CPU Usage:</strong> ${ container.cpu_percent }%</p>
                                <p><strong>Memory Usage:</strong> ${ container.mem_usage } / ${ container.mem_limit } (${ container.mem_percent }%)</p>
                                <p><strong>Network Input:</strong> ${ container.net_input }</p>
                                <p><strong>Network Output:</strong> ${ container.net_output }</p>
                                <p><strong>Disk I/O:</strong> ${ container.block_input } / ${ container.block_output }</p>
                            </div>
                            <div class="card-footer">
                                <button onclick="changeContainerState('${ container.name }', 'stop')">Stop</button>
                                <button onclick="changeContainerState('${ container.name }', 'restart')">Restart</button>
                            </div>
                        </div>
                    `);
                } );
            } );
        }

        function changeContainerState( containerName, action ) {
            $.post( `/api/container/${ action }`, { name: containerName }, function ( response ) {
                if ( response.success ) {
                    alert( `Container ${ action }ed successfully!` );
                    fetchContainerStats(); // Refresh stats after action
                } else {
                    alert( 'Failed to change container state.' );
                }
            } );
        }

        // Fetch stats every 5 seconds
        setInterval( fetchContainerStats, 5000 );

        // Initial fetch
        fetchContainerStats();
    </script>
</body>

</html>
